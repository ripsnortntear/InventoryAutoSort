name: InventoryAutoSort
version: 1.2.0
main: com.blackboxai.inventoryautosort.InventoryAutoSort
# 1.21 covers the entire 1.21.x family including 1.21.4 (Paper build 26.1.2)
api-version: '1.21'
description: Double right-click any empty slot to sort & stack your inventory!
author: BlackboxAI

commands:
  inventorysort:
    description: Toggle InventoryAutoSort on or off for yourself.
    usage: /inventorysort
    permission: inventoryautosort.use

permissions:
  inventoryautosort.use:
    description: Allows a player to use InventoryAutoSort.
    default: true
