# InventoryAutoSort Configuration
# ---------------------------------

# How long (milliseconds) between the two right-clicks to trigger sort
# Default: 500ms
double-click-window: 500

# How long (milliseconds) a player must wait between successful sorts
# Default: 2000ms (2 seconds)
sort-cooldown: 2000

# Whether to show the action bar message after sorting
show-action-bar: true

# Whether to play sounds
play-sounds: true

# Debug mode - logs sort operations to console
debug: false
